[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'mx-eye'
version = '0.1.0'
description = 'MXBI pupil and corneal reflection tracker and receiver SDK'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
gui = ['numpy>=1.24,<3', 'opencv-python-headless>=4.8,<5', 'psutil>=5.9,<8', 'PySide6>=6.6,<7', 'pyqtgraph>=0.13,<0.15', "pygrabber>=0.2; sys_platform == 'win32'"]
test = ['pytest>=8,<10']

[project.scripts]
mx-eye = 'app.gui:main'
mx-eye-receiver = 'app.receiver:main'

[tool.setuptools.packages.find]
include = ['app*']

[tool.pytest.ini_options]
testpaths = ['tests']
